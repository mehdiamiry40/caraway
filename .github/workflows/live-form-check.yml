name: Live form check

# Loads the pages that carry lead forms on the deployed site and fails if a
# form stays disabled or the browser blocks a script. Read-only: nothing is
# typed or submitted, and analytics beacons are blocked.
on:
  # Vercel reports every deployment here. The job only runs for a successful
  # Production deployment.
  deployment_status:
  # Deploys are not the only way production changes. A CDN, platform or
  # caching change can break hydration between them.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-form-check
  cancel-in-progress: false

jobs:
  forms:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production')
    # Pinned to the same image as CI: the installed Playwright cannot install
    # Chromium on the Ubuntu 26.04 image that `ubuntu-latest` now selects.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Always the reviewed checks on main, whichever commit an event names.
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        timeout-minutes: 5

      # The deployment is reported ready slightly before caraway.au points at
      # it. Without the pause this would check the previous deployment.
      - if: github.event_name == 'deployment_status'
        run: sleep 60

      - name: Check lead forms on the live site
        run: npm run test:e2e:production
        env:
          FORM_CHECK_BASE_URL: https://caraway.au
