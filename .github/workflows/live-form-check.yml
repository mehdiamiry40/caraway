name: Live form check

# Loads the pages that carry lead forms on the deployed site and fails if a
# form stays disabled or the browser blocks a script. Read-only: nothing is
# typed or submitted, and analytics beacons are blocked.
on:
  # Vercel reports every deployment here. The job only runs for a successful
  # Production deployment.
  deployment_status:
  # Deploys are not the only way production changes. A CDN, platform or
  # caching change can break hydration between them.
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# One check runs at a time and at most one more waits; a newer event replaces
# the one that is waiting. That is fine between real checks, which all load
# the same live site. But every preview deployment raises an event here too,
# from the copy of this file on its own branch, and the job below skips it.
# If such an event shared the queue it could replace the waiting check for a
# new Production deployment, and that check would never run. So events the job
# would skip get a group of their own.
# - The condition must stay the same as the job's `if`.
# - Do not rename the shared group back to `live-form-check`: branches cut
#   before this change still put their preview events in a group of that name.
concurrency:
  group: >-
    ${{
    (github.event_name != 'deployment_status' ||
    (github.event.deployment_status.state == 'success' &&
    github.event.deployment.environment == 'Production'))
    && 'live-site-form-check'
    || format('live-form-check-skipped-{0}', github.run_id)
    }}
  cancel-in-progress: false

jobs:
  forms:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production')
    # Pinned to the same image as CI: the installed Playwright cannot install
    # Chromium on the Ubuntu 26.04 image that `ubuntu-latest` now selects.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Always the reviewed checks on main, whichever commit an event names.
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        timeout-minutes: 5
      # The runner image already carries every library Chromium needs. On it
      # `playwright install-deps` only adds fonts that this check does not
      # depend on, and that download from the runner's Ubuntu mirror has
      # repeatedly run past its time limit, so a slow mirror was reported as
      # a failed form check. The packages are installed only when the browser
      # cannot start, for example after a runner image drops a library.
      # Keep in step with ci.yml.
      - id: chromium
        name: Check whether Chromium starts with the packages on the runner
        run: |
          if node -e "
            const { chromium } = require('@playwright/test');
            (async () => {
              const browser = await chromium.launch({ timeout: 30000 });
              const page = await browser.newPage();
              await page.setContent('<p>ok</p>', { timeout: 30000 });
              await browser.close();
            })().catch((error) => {
              console.error(error.message);
              process.exit(1);
            });
          "; then
            echo "starts=true" >> "$GITHUB_OUTPUT"
          else
            echo "starts=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chromium did not start with the packages on the runner. Installing its system packages."
          fi
        timeout-minutes: 2
      - if: steps.chromium.outputs.starts != 'true'
        run: npx playwright install-deps chromium
        timeout-minutes: 5

      # The deployment is reported ready slightly before caraway.au points at
      # it. Without the pause this would check the previous deployment.
      - if: github.event_name == 'deployment_status'
        run: sleep 60

      - name: Check lead forms on the live site
        run: npm run test:e2e:production
        env:
          FORM_CHECK_BASE_URL: https://caraway.au
