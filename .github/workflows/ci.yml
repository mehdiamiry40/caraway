name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    # Pinned: `ubuntu-latest` moved to Ubuntu 26.04, which the installed
    # Playwright cannot install Chromium on. Move this when Playwright is
    # upgraded to a release that supports the newer image.
    runs-on: ubuntu-24.04
    # Nothing here legitimately runs this long. Without it a hung step burns
    # the default 6h job limit before anyone notices.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - run: npm ci
      # Turbo runs independent static checks in parallel and restores unchanged
      # results from the repository-local cache above.
      - run: npm run turbo:check

      # Browsers are keyed on the resolved Playwright version, so the cache
      # invalidates exactly when the browser build would change.
      - id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-chromium

      # The browser comes from Playwright's own download host. This step has
      # hung before, taking ~20min against a ~80s norm. The timeout turns an
      # open-ended hang into a fast, re-runnable failure; the cache above
      # means most runs skip the download entirely.
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        timeout-minutes: 5
      # The runner image already carries every library Chromium needs. On it
      # `playwright install-deps` only adds fonts that no check depends on,
      # and that download from the runner's Ubuntu mirror has repeatedly run
      # past its time limit and failed the job before a single test started.
      # So the packages are installed only when the browser cannot start, for
      # example after a runner image drops a library.
      # Keep in step with live-form-check.yml.
      - id: chromium
        name: Check whether Chromium starts with the packages on the runner
        run: |
          if node -e "
            const { chromium } = require('@playwright/test');
            (async () => {
              const browser = await chromium.launch({ timeout: 30000 });
              const page = await browser.newPage();
              await page.setContent('<p>ok</p>', { timeout: 30000 });
              await browser.close();
            })().catch((error) => {
              console.error(error.message);
              process.exit(1);
            });
          "; then
            echo "starts=true" >> "$GITHUB_OUTPUT"
          else
            echo "starts=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chromium did not start with the packages on the runner. Installing its system packages."
          fi
        timeout-minutes: 2
      - if: steps.chromium.outputs.starts != 'true'
        run: npx playwright install-deps chromium
        timeout-minutes: 5

      - run: npm run test:e2e
      # Each SEO check depends on the same production build in turbo.json.
      # One invocation keeps the build environment and cache key identical,
      # then fans the artifact checks out in parallel after Next.js completes.
      # Pull-request code must never execute with production delivery secrets.
      - name: Verify production artifacts without secrets
        if: github.event_name == 'pull_request'
        run: npm run turbo:verify
        env:
          SITE_URL: https://caraway.au
      # Main still verifies the real webhook configuration after reviewed code
      # lands, preserving the production-only configuration check.
      - name: Verify production artifacts on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run turbo:verify
        env:
          QUOTE_ENDPOINT: ${{ secrets.QUOTE_ENDPOINT }}
          CONTACT_ENDPOINT: ${{ secrets.CONTACT_ENDPOINT }}
          SITE_URL: https://caraway.au
      # Lead forms render disabled and are enabled by hydration, which depends
      # on the hashed Content-Security-Policy that only a production build
      # carries. The dev-server suite above cannot see that break. This reuses
      # the build the verify step produced, serves it with every integration
      # setting blanked, and never submits a form.
      - name: Check lead forms on the production build
        run: npm run test:e2e:production
      # Cited government sources move without notice, and unit tests only pin
      # the strings. Non-blocking so third-party outages cannot redden a PR.
      - run: npm run check:sources -- --report
        continue-on-error: true

      # Tell IndexNow-participating engines (Bing, Yandex, Seznam, Naver) which
      # pages changed. Google ignores IndexNow, so this supplements rather than
      # replaces sitemap/Search Console discovery. Push-to-main only: a preview
      # build must never announce URLs as live. Non-blocking so a third-party
      # outage cannot redden main.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run seo:indexnow
        continue-on-error: true
