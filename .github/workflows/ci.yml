name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
        env:
          QUOTE_ENDPOINT: ${{ secrets.QUOTE_ENDPOINT }}
          CONTACT_ENDPOINT: ${{ secrets.CONTACT_ENDPOINT }}
          SITE_URL: https://caraway.au
      - run: npm run check:indexability
      - run: npm run check:bundle
      - run: npm run check:headings
      # Cited government sources move without notice, and unit tests only pin
      # the strings. Non-blocking so third-party outages cannot redden a PR.
      - run: npm run check:sources -- --report
        continue-on-error: true
