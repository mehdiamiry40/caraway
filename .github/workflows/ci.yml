name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    # Nothing here legitimately runs this long. Without it a hung step burns
    # the default 6h job limit before anyone notices.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      # Browsers are keyed on the resolved Playwright version, so the cache
      # invalidates exactly when the browser build would change.
      - id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-chromium

      # This step has hung repeatedly on the browser download / apt mirrors,
      # taking ~20min against a ~80s norm. The timeout turns an open-ended
      # hang into a fast, re-runnable failure; the cache above means most runs
      # skip the download entirely.
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      # Browsers are cached but apt packages are not — each run is a fresh VM.
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        timeout-minutes: 5

      - run: npm run test:e2e
      - run: npm run build
        env:
          QUOTE_ENDPOINT: ${{ secrets.QUOTE_ENDPOINT }}
          CONTACT_ENDPOINT: ${{ secrets.CONTACT_ENDPOINT }}
          SITE_URL: https://caraway.au
      - run: npm run check:indexability
      - run: npm run check:bundle
      - run: npm run check:headings
      # Cited government sources move without notice, and unit tests only pin
      # the strings. Non-blocking so third-party outages cannot redden a PR.
      - run: npm run check:sources -- --report
        continue-on-error: true

      # Tell IndexNow-participating engines (Bing, Yandex, Seznam, Naver) which
      # pages changed. Google ignores IndexNow, so this supplements rather than
      # replaces sitemap/Search Console discovery. Push-to-main only: a preview
      # build must never announce URLs as live. Non-blocking so a third-party
      # outage cannot redden main.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run seo:indexnow
        continue-on-error: true
