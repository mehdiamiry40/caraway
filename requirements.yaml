project:
  name: "Caraway"
  purpose: "Brisbane vehicle-buying, quote, and lead-generation website"
  deployment: "Vercel"

runtime:
  framework: "Next.js 16 App Router"
  language: "TypeScript 6"
  ui: "React 19 and Tailwind CSS 4"
  forms: "react-hook-form with Zod validation"

capabilities:
  - "Server-rendered service, location, company, legal, and blog pages"
  - "Interactive price estimator and detailed quote form"
  - "Contact form with webhook and Resend delivery fallbacks"
  - "Google Places address autocomplete through a first-party API proxy"
  - "Vercel AI Gateway chatbot for vehicle estimates and customer questions"
  - "Sitemap, robots, canonical metadata, and structured data"
  - "First-party health checks, sitemap, robots, canonical metadata, and structured data"
  - "Responsive layouts, keyboard navigation, reduced-motion support, and accessible form errors"

quality_gates:
  - "npm run lint"
  - "npm run typecheck"
  - "npm test"
  - "npm run build"
  - "npm audit --audit-level=moderate"
  - "npm run audit:swarm"

content_rules:
  - "Use the current ABR entity details for the business identity"
  - "Do not claim a motor-dealer licence unless a current licence number is verified"
  - "Do not give blanket Queensland number-plate, registration-transfer, or safety-certificate instructions"
  - "Link to current Queensland Government guidance for legal and registration processes"
  - "Treat price, pickup timing, and payment statements as conditional rather than guaranteed"
